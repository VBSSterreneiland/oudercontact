const cfgFb={apiKey:"AIzaSyBynXKGd1IAoGPohX_uKN0lkyh6qIlOXyk",authDomain:"oudercontact-school.firebaseapp.com",projectId:"oudercontact-school",storageBucket:"oudercontact-school.firebasestorage.app",messagingSenderId:"462228061509",appId:"1:462228061509:web:79de610e7184dfa904922c"};

let me=null,tab='ouder',msg='',cfg=null,slots={},priv={},bk={},tlist=[],unsubs=[],atab='dagen',q='',kf='',sel=new Set(),stu=[],apps=[],sch={},clsMap={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
const K=s=>String(s).trim().toUpperCase(),mail=(n,i=0)=>norm(n).replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'')+(i?'-'+i:'')+'@oudercontact.school';
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m},hm=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const blocksOf=(t,d)=>{const v=(sch[t]||{})[d];if(!v)return[{a:cfg.start,b:cfg.end}];return typeof v[0]==='string'?[{a:v[0],b:v[1]}]:v};
const inB=(B,tm)=>B.some(q=>mins(tm)>=mins(q.a)&&mins(tm)<mins(q.b));
const timesFor=(t,d)=>{const B=blocksOf(t,d),r=[];for(let n=0;n<1440;n+=15){const tm=hm(n);if(inB(B,tm))r.push(tm)}return r};

const errT=e=>({'auth/invalid-credential':'Gegevens kloppen niet.','auth/email-already-in-use':'bestaat al','permission-denied':'Niet toegestaan. Mogelijke oorzaken: dit kwartier is net bezet, je hebt al een afspraak bij deze leerkracht, of de gegevens van leerkrachten/leerlingen zijn nog niet hersteld (beheerder: tabblad Leerkrachten, knop Controleren en herstellen).'}[e.code]||e.message);
function parseCSV(t,n){const L=t.split(/\r?\n/).filter(l=>l.trim());if(!L.length)return[];const sep=L[0].includes(';')?';':',';const r=L.map(l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')));if(/^(voor)?naam$/i.test(r[0][0]))r.shift();return r.filter(x=>x.length>=n&&x[0])}
function stop(){unsubs.forEach(u=>u());unsubs=[]}
function start(tids=[]){stop();
 unsubs.push(onSnapshot(doc(db,'config','main'),s=>{cfg=s.exists()?s.data():null;render()}));

 if(me.role==='ouder')tids.forEach(t=>unsubs.push(onSnapshot(doc(db,'bookings',me.h+'_'+t),s=>{s.exists()?bk[t]=s.data().slot:delete bk[t];render()})))}
function grid(tid,mode){const days=cfg.days.filter(x=>x.open);if(!days.length)return'<p class="mu">Er zijn nog geen dagen open.</p>';const all=days.flatMap(x=>blocksOf(tid,x.d)),T=[];if(all.length)for(let n=Math.min(...all.map(q=>mins(q.a)));n<Math.max(...all.map(q=>mins(q.b)));n+=15)T.push(hm(n));
 const vis=(d,tm)=>{const st=slots[sid(tid,d,tm)];return st==='booked'||(!st&&inB(blocksOf(tid,d),tm))};let D=days,TT=T;if(mode==='ouder'){D=days.filter(x=>T.some(tm=>vis(x.d,tm)));TT=T.filter(tm=>D.some(x=>vis(x.d,tm)));if(!D.length)return'<p class="mu">Er zijn bij deze leerkracht geen vrije momenten.</p>'}
 let h='<div class="grid"><table><tr><th></th>'+D.map(x=>'<th>'+dl(x.d)+(mode==='leerkracht'?`<br><button class="c off" style="padding:2px 6px;margin-top:3px" data-a="day" data-d="${x.d}">hele dag ⇄</button>`:'')+'</th>').join('')+'</tr>';
 let pv=null;for(const tm of TT){if(pv&&mins(tm)-mins(pv)>15)h+='<tr><td colspan="'+(D.length+1)+'" class="mu" style="padding:2px">⋯</td></tr>';pv=tm;h+='<tr><td class="t">'+tm+'</td>';for(const x of D){const k=sid(tid,x.d,tm),st=slots[k];let c;if(st!=='booked'&&!inB(blocksOf(tid,x.d),tm)){h+='<td><span class="mu">·</span></td>';continue}
  if(mode==='leerkracht')c=st==='booked'?`<button class="c mine" disabled>${esc(priv[k]||'bezet')}</button>`:`<button class="c ${st?'off':'free'}" data-a="tog" data-k="${k}" data-st="${st||''}">${st?'✗ past niet':'✓ open'}</button>`;
  else c=bk[tid]===k?`<button class="c mine" data-a="cancel" data-k="${k}">Jouw afspraak ✕</button>`:st==='booked'?'<button class="c taken" disabled>Bezet</button>':st?'<span class="mu">–</span>':`<button class="c free" data-a="book" data-k="${k}">Vrij</button>`;
  h+='<td>'+c+'</td>'}h+='</tr>'}return h+'</table></div>'}
function login(){const f={ouder:`<label>Voornaam kind<input id="v" autocomplete="off"></label><label>Achternaam kind<input id="a" autocomplete="off"></label>`,

 return`<div class="card" style="max-width:420px;margin:30px auto"><h2 style="margin-top:0">Inloggen</h2><div class="tabs">${['ouder','leerkracht','beheerder'].map(t=>`<button class="${t===tab?'on':''}" data-a="tab" data-t="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${f}<button class="pr" data-a="login">Inloggen</button><p class="err">${esc(msg)}</p></div>`}

 return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VBS Sterreneiland//Oudercontact//NL','CALSCALE:GREGORIAN',...L.flatMap(a=>['BEGIN:VEVENT','UID:'+a.d+a.tm.replace(':','')+'-'+a.tid+'@oudercontact','DTSTAMP:'+st,'DTSTART:'+f(a.d,a.tm),'DTEND:'+f(a.d,hm(mins(a.tm)+15)),'SUMMARY:Oudercontact '+a.naam,'DESCRIPTION:Oudercontact voor '+me.v+' '+me.a+' bij '+a.naam,'LOCATION:VBS Sterreneiland','BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:Oudercontact','END:VALARM','END:VEVENT']),'END:VCALENDAR'].join('\r\n')}

 return`<div class="card"><h3 style="margin-top:0">Mijn uren per dag</h3><p class="mu">Wil je ook voor of na de gewone uren afspraken aanbieden, bijvoorbeeld 's morgens voor school én 's avonds? Je kan per dag meerdere blokken instellen (tussen ${xs} en ${xe}). Met <b>+ blok</b> voeg je een blok toe, met ✕ verwijder je er een. Ouders zien enkel de kwartieren binnen je blokken. Standaard: ${cfg.start}–${cfg.end}. Een wijziging wordt meteen bewaard.</p>`+cfg.days.filter(x=>x.open).map(x=>{const B=blocksOf(me.uid,x.d);return`<div class="row"><b style="width:110px">${dl(x.d)}</b>${B.map((q,i)=>`<span>van <input type="time" data-h="a" data-d="${x.d}" data-i="${i}" value="${q.a}" min="${xs}" max="${xe}" step="900"> tot <input type="time" data-h="b" data-d="${x.d}" data-i="${i}" value="${q.b}" min="${xs}" max="${xe}" step="900"> <button data-a="hdel" data-d="${x.d}" data-i="${i}">✕</button></span>`).join('')}<button data-a="hadd" data-d="${x.d}">+ blok</button>${B.length?'':'<span class="mu">geen uren op deze dag</span>'}</div>`}).join('')+`<div class="row"><button data-a="hreset">Alles terugzetten naar standaard</button></div></div>`}

async function saveHours(d){try{const xs=cfg.xstart||'07:00',xe=cfg.xend||'20:00',A=[...document.querySelectorAll('[data-h="a"][data-d="'+d+'"]')],Z=[...document.querySelectorAll('[data-h="b"][data-d="'+d+'"]')],B=A.map((e,i)=>({a:e.value,b:Z[i].value})).sort((p,q)=>mins(p.a||'00:00')-mins(q.a||'00:00'));
 if(B.some(q=>!q.a||!q.b||mins(q.a)>=mins(q.b)))msg='Bij elk blok moet het einduur na het beginuur liggen.';
 else if(B.some(q=>mins(q.a)<mins(xs)||mins(q.b)>mins(xe)))msg='Kies uren tussen '+xs+' en '+xe+'.';
 else if(B.some((q,i)=>i&&mins(q.a)<mins(B[i-1].b)))msg='Blokken mogen elkaar niet overlappen.';
 else{await putDay(d,B);msg='Uren bewaard voor '+dl(d)+'.'}}catch(er){msg=errT(er)}render()}
const AT=[['dagen','Dagen & uren'],['leer','Leerkrachten'],['klas','Klassen'],['leerl','Leerlingen'],['afs','Afspraken']];

 <div class="card"><h3 style="margin-top:0">Leerlingen (${stu.length})</h3><div class="row"><input id="q" placeholder="Zoeken…" value="${esc(q)}" data-a="q" style="width:160px"><select id="kf" data-a="kf"><option value="">Alle klassen</option>${ks.map(k=>`<option ${k===kf?'selected':''}>${esc(k)}</option>`).join('')}</select>
 <button data-a="sdelsel">Verwijder geselecteerde (${sel.size})</button>${kf?`<button data-a="sdelklas">Verwijder klas ${esc(kf)}</button>`:''}<button data-a="sdelall">Alles verwijderen</button></div><div class="grid" id="sl">${studList()}</div></div>`,
 afs:`<div class="card"><h3 style="margin-top:0">Afspraken (${apps.length})</h3><div class="row"><button data-a="aexp">Exporteer CSV</button><button data-a="aclear">Alle afspraken wissen</button></div>
 <p class="mu">${tlist.map(t=>esc(t.naam)+': '+apps.filter(a=>a.tid===t.id).length).join(' · ')}</p>
 <div class="grid"><table><tr><th>Datum</th><th>Tijd</th><th>Leerkracht</th><th>Kind</th><th></th></tr>${apps.map(a=>`<tr><td>${dl(a.d)}</td><td>${a.tm}</td><td>${esc(tname(a.tid))}</td><td>${esc(a.name)}</td><td><button data-a="adel" data-id="${a.id}">✕</button></td></tr>`).join('')}</table></div>${apps.length?'':'<p class="mu">Nog geen afspraken.</p>'}</div>`};
 return bar+T[atab]}
function render(){$('#who').innerHTML=me?`${me.role} <button data-a="out">Uitloggen</button>`:'';
 $('#app').innerHTML=!me?login():me.role==='ouder'?ouder():me.role==='leerkracht'?leerkracht():beheerder()}
const saveCfg=()=>setDoc(doc(db,'config','main'),cfg);
const loadT=async()=>{tlist=(await getDocs(collection(db,'teachers'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>kl(a).localeCompare(kl(b)))};
const loadS=async()=>{stu=(await getDocs(collection(db,'students'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.klas+a.a+a.v).localeCompare(b.klas+b.a+b.v))};
const loadC=async()=>{clsMap={};(await getDocs(collection(db,'classes'))).forEach(d=>clsMap[d.id]=d.data())};
const loadA=async()=>{apps=(await getDocs(collection(db,'private'))).docs.map(d=>{const[tid,dd,h]=d.id.split('_');return{id:d.id,name:d.data().name,tid,student:d.data().student,d:dd,tm:h.slice(0,2)+':'+h.slice(2)}}).sort((a,b)=>(a.d+a.tm).localeCompare(b.d+b.tm))};
const tname=id=>{const t=tlist.find(t=>t.id===id);return t?t.naam+' ('+kl(t)+')':'?'};
const hashOf=(v,a)=>sha(norm(v)+'|'+norm(a));
const chunks=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
async function delApp(a){const b=writeBatch(db);b.delete(doc(db,'slots',a.id));b.delete(doc(db,'private',a.id));b.delete(doc(db,'bookings',a.student+'_'+a.tid));await b.commit()}
async function clearBk(h){const s=await getDocs(query(collection(db,'private'),where('student','==',h)));for(const d of s.docs)await delApp({id:d.id,student:h,tid:d.data().tid})}
async function delS(ids){for(const h of ids)await clearBk(h);for(const c of chunks(ids,400)){const b=writeBatch(db);c.forEach(h=>b.delete(doc(db,'students',h)));await b.commit()}ids.forEach(h=>sel.delete(h));await loadS();msg=ids.length+' leerling(en) verwijderd.'}
async function setCls(k,uid,naam,add,rol=''){const r=doc(db,'classes',k),x=await getDoc(r),o=x.exists()?x.data():{};const L=(o.teachers||[]).filter(y=>y.uid!==uid);if(add)L.push({uid,naam,rol});L.length?await setDoc(r,{teachers:L,titu:L.some(y=>y.uid===o.titu)?o.titu:null}):await deleteDoc(r)}
async function setRol(t,rol){await setDoc(doc(db,'teachers',t.id),{naam:t.naam,klassen:kls(t),rol});for(const k of kls(t)){const r=doc(db,'classes',k),x=await getDoc(r);if(!x.exists())continue;const d=x.data();await setDoc(r,{teachers:(d.teachers||[]).map(y=>y.uid===t.id?{...y,rol}:y),titu:d.titu||null})}await loadT()}
async function wipeT(id){for(const c of['slots','private']){const s=await getDocs(query(collection(db,c),where('tid','==',id)));for(const ch of chunks(s.docs,150)){const b=writeBatch(db);ch.forEach(d=>{b.delete(d.ref);if(c==='private')b.delete(doc(db,'bookings',d.data().student+'_'+id))});await b.commit()}}}
async function addTeacher(naam,pw,klas){if(!parseKl(klas).length)throw new Error('Geen klas');if(tlist.some(t=>norm(t.naam)===norm(naam)))throw new Error(naam+' bestaat al');
 for(let i=0;i<6;i++){try{const c=await createUserWithEmailAndPassword(secAuth,mail(naam,i),pw);await signOut(secAuth);const u=c.user.uid;const ks=parseKl(klas);await setDoc(doc(db,'teachers',u),{naam,klassen:ks,rol:''});for(const k of ks)await setCls(k,u,naam,true);return u}catch(e){if(e.code!=='auth/email-already-in-use')throw e}}throw new Error('Aanmaken mislukt')}
async function dropT(t){await wipeT(t.id);await deleteDoc(doc(db,'teachers',t.id));for(const k of kls(t))await setCls(k,t.id,t.naam,false)}
const flt=()=>stu.filter(s=>(!kf||kls(s).includes(kf))&&(!q||norm(s.v+' '+s.a).includes(norm(q))));
async function doLogin(){const v=($('#v')||{}).value||'',p=($('#p')||{}).value||'',x=($('#a')||{}).value||'';
 if(tab==='ouder'){await signOut(auth);const u=(await signInAnonymously(auth)).user,h=await sha(norm(v)+'|'+norm(x));
  const s=await getDoc(doc(db,'students',h));if(!s.exists()){await signOut(auth);msg='Leerling niet gevonden. Controleer de schrijfwijze.';return}
  await setDoc(doc(db,'claims',u.uid),{student:h});const d=s.data(),tm={};for(const k of kls(d)){const c=await getDoc(doc(db,'classes',k));if(c.exists()){const cd=c.data();(cd.teachers||[]).forEach(x=>{const e=tm[x.uid]=tm[x.uid]||{uid:x.uid,naam:x.naam,rol:x.rol||'',kl:[],titu:false};e.kl.push(k);if(cd.titu===x.uid)e.titu=true})}}
  me={role:'ouder',h,...d,teachers:Object.values(tm).sort((a,b)=>(b.titu-a.titu)||a.naam.localeCompare(b.naam))};bk={};start(me.teachers.map(t=>t.uid))}
 else if(tab==='leerkracht'){let u=null,t;for(let i=0;i<6&&!u;i++){try{const x=(await signInWithEmailAndPassword(auth,mail(v,i),p)).user,d=await getDoc(doc(db,'teachers',x.uid));if(d.exists()){u=x;t=d}else await signOut(auth)}catch(e){if(e.code!=='auth/invalid-credential'&&e.code!=='auth/user-not-found')throw e}}
  if(!u){msg='Naam of wachtwoord klopt niet.';return}me={role:'leerkracht',uid:u.uid,...t.data()};start([u.uid])}
 else{const u=(await signInWithEmailAndPassword(auth,v.trim(),p)).user;if(u.uid!==ADMIN_UID){await signOut(auth);msg='Geen beheerder.';return}
  me={role:'beheerder'};await loadT();start()}}
async function repair(){await loadT();await loadS();let nt=0,ns=0;
 for(const t of tlist){const ks=parseKl(kls(t).join('/'));if(JSON.stringify(ks)!==JSON.stringify(t.klassen)){await setDoc(doc(db,'teachers',t.id),{naam:t.naam,klassen:ks,rol:t.rol||''});t.klassen=ks;nt++}}
 for(const ch of chunks(stu.filter(x=>JSON.stringify(parseKl(kls(x).join('/')))!==JSON.stringify(x.klassen)),400)){const b=writeBatch(db);ch.forEach(x=>{const ks=parseKl(kls(x).join('/'));b.set(doc(db,'students',x.id),{v:x.v,a:x.a,klas:ks.join('/'),klassen:ks});x.klassen=ks;ns++});await b.commit()}
 const want={},hv={};tlist.forEach(t=>kls(t).forEach(k=>(want[k]=want[k]||[]).push({uid:t.id,naam:t.naam,rol:t.rol||''})));
 for(const d of(await getDocs(collection(db,'classes'))).docs){hv[d.id]=d.data().titu;if(!want[d.id])await deleteDoc(d.ref)}
 for(const[k,L]of Object.entries(want))await setDoc(doc(db,'classes',k),{teachers:L,titu:L.some(x=>x.uid===hv[k])?hv[k]:null});
 await loadT();const zonder=[...new Set(stu.flatMap(kls).filter(k=>!want[k]))];
 msg='Hersteld ('+nt+' leerkrachten, '+ns+' leerlingen aangepast). Klassen met leerkracht: '+(Object.entries(want).map(([k,L])=>k+' ('+L.map(x=>x.naam).join(', ')+')').join(' · ')||'geen')+'.'+(zonder.length?' ⚠ Leerlingen in klassen zonder leerkracht: '+zonder.join(', ')+'.':'')}
async function importT(txt){const rows=parseCSV(txt,3);let ok=0,bad=[];
 for(const[naam,pw,klas]of rows){try{await addTeacher(naam,pw,klas);await loadT();ok++}catch(e){bad.push(naam+' ('+errT(e)+')')}}
 msg=ok+' leerkrachten toegevoegd.'+(bad.length?' Mislukt: '+bad.join(', '):'')}
async function importS(txt){const rows=parseCSV(txt,3);for(const ch of chunks(rows,400)){const b=writeBatch(db);
 for(const[v,a,k]of ch)b.set(doc(db,'students',await hashOf(v,a)),{v,a,klas:parseKl(k).join('/'),klassen:parseKl(k)});await b.commit()}await loadS();msg=rows.length+' leerlingen geïmporteerd.'}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;const a=b.dataset.a,k=b.dataset.k;
 try{if(a==='tab'){tab=b.dataset.t;msg=''}
 else if(a==='out'){stop();await signOut(auth);me=null;msg='';slots={};priv={};bk={}}
 else if(a==='login'){msg='';b.disabled=true;await doLogin()}
 else if(a==='tog'){b.disabled=true;b.dataset.st?await deleteDoc(doc(db,'slots',k)):await setDoc(doc(db,'slots',k),{status:'blocked',tid:me.uid})}
 else if(a==='book'){msg='';const tid=k.split('_')[0],tt=k.split('_').slice(1).join('_');
  if(Object.entries(bk).some(([o,x])=>o!==tid&&x.split('_').slice(1).join('_')===tt))msg='Je hebt op dat moment al een afspraak bij een andere leerkracht.';
  else{const bt=writeBatch(db);bt.set(doc(db,'slots',k),{status:'booked',tid});bt.set(doc(db,'private',k),{name:me.v+' '+me.a,tid,student:me.h});bt.set(doc(db,'bookings',me.h+'_'+tid),{slot:k});await bt.commit()}}
 else if(a==='cancel'){msg='';const tid=k.split('_')[0],bt=writeBatch(db);bt.delete(doc(db,'slots',k));bt.delete(doc(db,'private',k));bt.delete(doc(db,'bookings',me.h+'_'+tid));await bt.commit()}
 else if(a==='dayadd'){const d=$('#nd').value;cfg=cfg||{days:[],start:'16:00',end:'19:00'};if(d&&!cfg.days.some(x=>x.d===d)){cfg.days.push({d,open:true});cfg.days.sort((x,y)=>x.d<y.d?-1:1);await saveCfg()}}
 else if(a==='daydel'){cfg.days.splice(b.dataset.i,1);await saveCfg()}
 else if(a==='hours'){const s=$('#st').value,n=$('#en').value;cfg=cfg||{days:[]};if(s&&n&&mins(s)<mins(n)){cfg.start=s;cfg.end=n;await saveCfg()}}
 else if(a==='atab'){atab=b.dataset.t;msg='';if(atab==='leer')await loadT();if(atab==='klas'){await loadT();await loadS();await loadC()}if(atab==='leerl')await loadS();if(atab==='afs'){await loadT();await loadA()}}
 else if(a==='ics'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([ics(myApps())],{type:'text/calendar'}));l.download='oudercontact.ics';l.click()}
 else if(a==='trol'){const t=tlist.find(x=>x.id===b.dataset.id),v=prompt('Functie die ouders naast de naam zien (leeg laten = geen), bv. turnleerkracht, zorgcoördinator',t.rol||'');if(v!==null){await setRol(t,v.trim());msg='Functie bewaard.'}}
 else if(a==='hadd'){const d=b.dataset.d,B=blocksOf(me.uid,d),xe=mins(cfg.xend||'20:00'),st=mins(B.length?B[B.length-1].b:cfg.start),en=Math.min(st+60,xe);if(en-st<15)msg='Geen ruimte meer voor een extra blok (pas eerst een ander blok aan).';else await putDay(d,[...B,{a:hm(st),b:hm(en)}])}
 else if(a==='hdel'){const d=b.dataset.d;await putDay(d,blocksOf(me.uid,d).filter((_,i)=>i!==+b.dataset.i))}
 else if(a==='hreset'){await setDoc(doc(db,'schedules',me.uid),{days:{}});msg='Uren teruggezet naar standaard.'}
 else if(a==='xhours'){const x1=$('#xs').value,x2=$('#xe').value;cfg=cfg||{days:[],start:'16:00',end:'19:00'};if(x1&&x2&&mins(x1)<mins(x2)){cfg.xstart=x1;cfg.xend=x2;await saveCfg();msg='Opgeslagen.'}}
 else if(a==='repair'){await repair()}
 else if(a==='day'){const d=b.dataset.d,ids=timesFor(me.uid,d).map(t=>sid(me.uid,d,t)),fr=ids.filter(i=>!slots[i]),bt=writeBatch(db);fr.length?fr.forEach(i=>bt.set(doc(db,'slots',i),{status:'blocked',tid:me.uid})):ids.filter(i=>slots[i]==='blocked').forEach(i=>bt.delete(doc(db,'slots',i)));await bt.commit()}
 else if(a==='tadd'){const n=$('#tn').value.trim(),p=$('#tp').value,k=$('#tk').value.trim();if(!n||p.length<6||!k)msg='Vul naam, klas en een wachtwoord van min. 6 tekens in.';else{await addTeacher(n,p,k);await loadT();msg=n+' toegevoegd.'}}
 else if(a==='tedit'){const t=tlist.find(x=>x.id===b.dataset.id),nk=prompt('Klassen van '+t.naam+' (meerdere met / ertussen, bv. 5A/6A)',kl(t)),ks=nk?parseKl(nk):[];if(ks.length){for(const k of kls(t))if(!ks.includes(k))await setCls(k,t.id,t.naam,false);for(const k of ks)await setCls(k,t.id,t.naam,true,t.rol||'');await setDoc(doc(db,'teachers',t.id),{naam:t.naam,klassen:ks,rol:t.rol||''});await loadT();msg='Klassen gewijzigd.'}}
 else if(a==='tpw'){const t=tlist.find(x=>x.id===b.dataset.id),p=prompt('Nieuw wachtwoord voor '+t.naam+' (min. 6 tekens). De kalender en afspraken van deze leerkracht worden gewist.');if(p&&p.length>=6){await dropT(t);await loadT();await addTeacher(t.naam,p,kl(t));await loadT();msg='Nieuw wachtwoord ingesteld voor '+t.naam+'.'}}
 else if(a==='tdel'){const t=tlist.find(x=>x.id===b.dataset.id);if(confirm(t.naam+' verwijderen, inclusief kalender en afspraken?')){await dropT(t);await loadT();msg=t.naam+' verwijderd.'}}
 else if(a==='sadd'){const v=$('#sv').value.trim(),an=$('#sa').value.trim(),k=$('#sk').value.trim();if(!v||!an||!k)msg='Vul voornaam, achternaam en klas in.';else{await setDoc(doc(db,'students',await hashOf(v,an)),{v,a:an,klas:parseKl(k).join('/'),klassen:parseKl(k)});await loadS();msg=v+' '+an+' toegevoegd.'}}
 else if(a==='sedit'){const s=stu.find(x=>x.id===b.dataset.id),v=prompt('Voornaam',s.v),an=v&&prompt('Achternaam',s.a),k=an&&prompt('Klassen (bv. 5A/6A)',kls(s).join('/'));if(k&&parseKl(k).length){const h=await hashOf(v,an);if(h!==s.id){await clearBk(s.id);await deleteDoc(doc(db,'students',s.id))}else if(parseKl(k).join('/')!==kls(s).join('/'))await clearBk(s.id);await setDoc(doc(db,'students',h),{v:v.trim(),a:an.trim(),klas:parseKl(k).join('/'),klassen:parseKl(k)});sel.delete(s.id);await loadS();msg='Leerling aangepast (een eventuele afspraak werd geannuleerd).'}}
 else if(a==='sdel'){const s=stu.find(x=>x.id===b.dataset.id);if(confirm(s.v+' '+s.a+' verwijderen?'))await delS([s.id])}
 else if(a==='sdelsel'){if(sel.size&&confirm(sel.size+' leerlingen verwijderen?'))await delS([...sel])}
 else if(a==='sdelklas'){const ids=stu.filter(s=>kls(s).includes(kf)).map(s=>s.id);if(confirm('Alle '+ids.length+' leerlingen van '+kf+' verwijderen?')){await delS(ids);kf=''}}
 else if(a==='sdelall'){if(stu.length&&confirm('ALLE '+stu.length+' leerlingen verwijderen?'))await delS(stu.map(s=>s.id))}
 else if(a==='adel'){const x=apps.find(y=>y.id===b.dataset.id);if(confirm('Afspraak van '+x.name+' annuleren?')){await delApp(x);await loadA();msg='Afspraak geannuleerd.'}}
 else if(a==='aclear'){if(apps.length&&confirm('ALLE '+apps.length+' afspraken wissen?')){for(const ch of chunks(apps,120)){const bt=writeBatch(db);ch.forEach(x=>{bt.delete(doc(db,'slots',x.id));bt.delete(doc(db,'private',x.id));bt.delete(doc(db,'bookings',x.student+'_'+x.tid))});await bt.commit()}await loadA();msg='Alle afspraken gewist.'}}
 else if(a==='aexp'){const csv='Datum;Tijd;Klas;Leerkracht;Kind\n'+apps.map(x=>{const t=tlist.find(y=>y.id===x.tid)||{};return[x.d,x.tm,t.naam?kl(t):'',t.naam,x.name].join(';')}).join('\n'),l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));l.download='afspraken.csv';l.click()}
 }catch(er){msg=errT(er)}render()});
document.addEventListener('change',async e=>{const b=e.target,a=b.dataset.a;if(b.dataset.h){await saveHours(b.dataset.d);return}if(!a)return;
 try{if(a==='titu'){const k=b.dataset.k,c=clsMap[k];await setDoc(doc(db,'classes',k),{teachers:c.teachers||[],titu:b.value||null});await loadC();msg='Titularis bewaard.';render();return}
 if(a==='turn'){const t=tlist.find(x=>x.id===b.dataset.id);await setRol(t,b.checked?'Turnleerkracht':'');msg=b.checked?t.naam+' is nu turnleerkracht.':'Functie verwijderd.';render();return}
 if(a==='kf'){kf=b.value;sel.clear();render();return}
 if(a==='sel'){b.checked?sel.add(b.dataset.id):sel.delete(b.dataset.id);render();return}
 if(a==='selall'){flt().forEach(x=>b.checked?sel.add(x.id):sel.delete(x.id));render();return}
 if(a==='dayopen'){cfg.days[b.dataset.i].open=b.checked;await saveCfg()}
 if(a==='csvT'||a==='csvS'){const f=b.files[0];if(!f)return;msg='Bezig…';render();const t=await f.text();await(a==='csvT'?importT(t):importS(t))}}
 catch(er){msg=errT(er)}render()});
document.addEventListener('input',e=>{if(e.target.dataset.a==='q'){q=e.target.value;$('#sl').innerHTML=studList()}});
render();
</script></body></html>
